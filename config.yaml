### InfluxDB connection settings
influxdb:
  host: "localhost"
  port: 8086
  username: ""
  password: ""
  database: ""

### Proxy server configuration
proxy:
  port: 8087
  host: "localhost"
  
  # Base path prefix for all routes (default: "/")
  # Example: "/proxy" will make endpoints available at /proxy/query, /proxy/write, etc.
  base_path: "/proxy"
  
  ## Query filtering settings

  # Disable query filtering (default: false - filtering enabled)
  # If set to true, all filtering rules will be ignored
  disable_query_filtering: false

  # Path to external filtering rules file
  # If specified, this file will be loaded for filtering rules
  # If not specified, inline filtering rules will be used
  filtering_rules_file: "filtering_rules.yaml"
  
# filtering_rules:
  # require_time_filter: true
  # max_time_range_hours: 720
  
  # IPs that bypass all filtering rules
  whitelisted_ips:
    # - "192.168.1.100"       # Example: specific IP
    # - "10.0.0.0/8"          # Example: CIDR range
    # - "127.0.0.1"           # Example: localhost

  # IPs that are filtered even when disable_query_filtering is true
  # This is only checked when disable_query_filtering is enabled
  blacklisted_ips:
    # - "127.0.0.1"           # Example: specific IP to always filter
    # - "172.16.0.0/12"       # Example: CIDR range to always filter
  
  ## InfluxDB client connection settings
  influxdb_client:
    timeout_seconds: 120              # Max query timeout (default: 120 seconds)
    idle_connection_pool_size: 200    # How many idle connections to keep to InfluxDB
    max_concurrent_connections: 400   # Max active connections to InfluxDB
    read_timeout_seconds: 60          # HTTP read timeout
    idle_timeout_seconds: 120         # HTTP idle timeout (keep-alive)
  
  ## HTTP server timeout settings (defaults to 2x client timeouts)
  server_timeouts:
    # read_timeout_seconds: 60        # Server read timeout (default: 2x client read timeout)
    # write_timeout_seconds: 240      # Server write timeout (default: 2x client write timeout)  
    # idle_timeout_seconds: 240       # Server idle timeout (default: 2x client idle timeout)


### Logging configuration
logging:
  level: "info"
  format: "json"  # json or text

### Metrics configuration
metrics:
  enabled: true
